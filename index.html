<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic Characteristics · T23</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Shared gradient used by the SVG illustrations -->
  <svg width="0" height="0" style="position: absolute;" aria-hidden="true">
    <defs>
      <linearGradient id="purple" x2="0.8" y2="1">
        <stop stop-color="#b8a0cc" />
        <stop offset="1" stop-color="#79528f" />
      </linearGradient>
    </defs>
  </svg>

  <main>
    <header>
      <h1>Dynamic Characteristics</h1>
      <p class="intro">
        Explore how sensors respond. Change a parameter,
        predict the result, and see it happen.
      </p>
    </header>

    <!-- Links to the four modules -->
    <div class="modules-grid">
      <a class="module-card" href="module1.html">
        <span class="module-number">MODULE 01</span>

        <svg class="module-icon" viewBox="0 0 160 120" aria-hidden="true">
          <rect x="18" y="12" width="129" height="94" rx="17" fill="url(#purple)" />
          <rect x="25" y="18" width="115" height="80" rx="12" fill="#f5ecfa" />
          <path d="M40 32 V83 H127" fill="none" stroke="#c8b3d6" stroke-width="2" />
          <path
            d="M41 82 C55 40 75 35 124 34"
            fill="none"
            stroke="#9169a6"
            stroke-width="6"
            stroke-linecap="round"
          />
          <circle cx="59" cy="49" r="5" fill="#b394c5" />
        </svg>

        <h2>First-order time response</h2>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="module-card pink-card" href="module2.html">
        <span class="module-number">MODULE 02</span>

        <svg class="module-icon" viewBox="0 0 160 120" aria-hidden="true">
          <rect x="17" y="13" width="130" height="93" rx="19" fill="url(#purple)" />
          <rect x="24" y="20" width="116" height="79" rx="13" fill="#fbefeb" />
          <path d="M30 59 H133" stroke="#e4cedd" stroke-width="2" />
          <path
            d="M30 60 Q43 13 56 60 T82 60 T108 60 T134 60"
            fill="none"
            stroke="#9973ac"
            stroke-width="5"
          />
          <path
            d="M30 72 Q43 43 56 72 T82 72 T108 72 T134 72"
            fill="none"
            stroke="#c4a9ce"
            stroke-width="4"
          />
        </svg>

        <h2>First-order frequency response</h2>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="module-card pink-card" href="module3.html">
        <span class="module-number">MODULE 03</span>

        <svg class="module-icon" viewBox="0 0 160 120" aria-hidden="true">
          <path
            d="M80 8 V20 L62 29 L98 40 L62 51 L98 62 L80 72 V82"
            fill="none"
            stroke="url(#purple)"
            stroke-width="8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <rect x="49" y="78" width="62" height="31" rx="9" fill="url(#purple)" />
          <path d="M48 8 H111" stroke="#a181b5" stroke-width="7" stroke-linecap="round" />
        </svg>

        <h2>Second-order response</h2>
        <span class="arrow" aria-hidden="true">›</span>
      </a>

      <a class="module-card" href="module4.html">
        <span class="module-number">MODULE 04</span>

        <svg class="module-icon" viewBox="0 0 160 120" aria-hidden="true">
          <rect
            x="44" y="15" width="78" height="90" rx="21"
            transform="rotate(9 83 60)"
            fill="#c5aed5"
          />
          <rect
            x="35" y="12" width="78" height="90" rx="21"
            transform="rotate(-9 74 57)"
            fill="url(#purple)"
          />
          <path
            d="M61 39 C62 25 89 26 89 41 C89 53 74 51 74 65"
            fill="none"
            stroke="#faf1fd"
            stroke-width="7"
            stroke-linecap="round"
          />
          <circle cx="74" cy="79" r="4" fill="#faf1fd" />
        </svg>

        <h2>Guess the sensor</h2>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </div>
  </main>
</body>
</html>
