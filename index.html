
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Order System Simulator</title>

    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>

<body>
    <h2>First Order System Simulator</h2>

    <p>
        Time Constant (τ):
        <span id="tauValue">1.0</span>
    </p>

    <input
        type="range"
        id="tauSlider"
        min="0.1"
        max="5"
        step="0.1"
        value="1"
    >

    <div id="plot" style="width:100%; max-width:800px; height:450px;"></div>

    <script>
        const K = 1;
        const A = 1;

        const slider = document.getElementById("tauSlider");
        const tauValue = document.getElementById("tauValue");

        function updatePlot() {
            const tau = parseFloat(slider.value);

            tauValue.textContent = tau.toFixed(1);

            const t = [];
            const y = [];

            for (let i = 0; i <= 100; i++) {
                const time = (5 * tau * i) / 100;

                t.push(time);
                y.push(K * A * (1 - Math.exp(-time / tau)));
            }

            const curve = {
                x: t,
                y: y,
                mode: "lines",
                name: "Response",
                line: { width: 3 }
            };

            const validationPoint = {
                x: [tau],
                y: [K * A * (1 - Math.exp(-1))],
                mode: "markers",
                name: "At t = τ",
                marker: { size: 10 }
            };

            const layout = {
                title: "First Order Step Response",
                xaxis: { title: "Time (t)" },
                yaxis: { title: "Output y(t)" },
                showlegend: true
            };

            Plotly.newPlot(
                "plot",
                [curve, validationPoint],
                layout,
                { responsive: true }
            );
        }

        slider.addEventListener("input", updatePlot);

        updatePlot();
    </script>
</body>
</html>
