<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ramp test</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <label>K: <input id="K" type="range" min="0.5" max="5" step="0.1" value="2">
    <span id="Kv">2</span></label><br>
  <label>τ: <input id="tau" type="range" min="0.2" max="5" step="0.1" value="1">
    <span id="tauv">1</span></label>

  <div id="rampPlot"></div>

  <script src="ramp.js"></script>
  <script>
    function refresh() {
      const K = parseFloat(document.getElementById('K').value);
      const tau = parseFloat(document.getElementById('tau').value);
      document.getElementById('Kv').textContent = K;
      document.getElementById('tauv').textContent = tau;
      updateRamp(K, tau, 10);   // t = end time, the function builds the array itself
    }
    document.getElementById('K').addEventListener('input', refresh);
    document.getElementById('tau').addEventListener('input', refresh);
    refresh();
  </script>
</body>
</html>
